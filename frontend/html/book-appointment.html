<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MediQueue — Book Appointment</title>

  <link
    rel="icon"
    href="../assets/images/logo-icon.png"
    type="image/png"
  />

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body>

<!-- ================= MOBILE PATIENT HEADER ================= -->

<header class="patient-mobile-header">

  <div class="patient-mobile-brand">

    <img
      src="../assets/images/logo-icon.png"
      alt="MediQueue logo"
    />

    <div>

      <div class="patient-mobile-brand-name font-display">
        MediQueue
      </div>

      <div class="patient-mobile-brand-label">
        Patient Portal
      </div>

    </div>

  </div>


  <button
    class="patient-menu-button"
    id="patientMenuButton"
    type="button"
    aria-label="Open navigation menu"
    aria-expanded="false"
  >

    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    >
      <line x1="4" y1="6" x2="20" y2="6"></line>
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="18" x2="20" y2="18"></line>
    </svg>

  </button>

</header>


<!-- Mobile menu overlay -->

<div
  class="patient-menu-overlay"
  id="patientMenuOverlay"
></div>


<div class="app-shell">

  <!-- ================= SIDEBAR ================= -->

  <aside
    class="sidebar patient-sidebar"
    id="patientSidebar"
  >

    <!-- Mobile close button -->

    <button
      class="patient-menu-close"
      id="patientMenuClose"
      type="button"
      aria-label="Close navigation menu"
    >
      ×
    </button>


    <div class="sidebar-brand">

      <img
        src="../assets/images/logo-icon.png"
        alt="MediQueue logo"
      />

      <div>

        <div class="sidebar-brand-name font-display">
          MediQueue
        </div>

        <div class="patient-sidebar-label">
          Patient Portal
        </div>

      </div>

    </div>


    <nav class="nav">

      <!-- Dashboard -->

      <a
        href="patient-dashboard.html"
        class="nav-item"
      >

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
        </svg>

        Dashboard

      </a>


      <!-- Book Appointment -->

      <a
        href="book-appointment.html"
        class="nav-item active"
      >

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="16"
            rx="2"
          ></rect>

          <path d="M16 3v4"></path>
          <path d="M8 3v4"></path>
          <path d="M3 11h18"></path>
          <path d="M12 14v4"></path>
          <path d="M10 16h4"></path>
        </svg>

        Book Appointment

      </a>


      <!-- Medical Record -->

      <a
        href="patient-medical-record.html"
        class="nav-item"
      >

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          ></path>

          <path d="M14 2v6h6"></path>
          <path d="M9 13h6"></path>
          <path d="M9 17h6"></path>
        </svg>

        Medical Record

      </a>


      <!-- Notifications -->

      <a
        href="patient-notifications.html"
        class="nav-item"
      >

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
          ></path>

          <path d="M10 21h4"></path>
        </svg>

        Notifications

      </a>

    </nav>


    <!-- Logout -->

    <a
      href="patient-login.html"
      class="nav-logout"
      id="patientLogout"
    >

      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
        ></path>

        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>

      Logout

    </a>

  </aside>


  <!-- ================= MAIN ================= -->

  <main class="main">

    <!-- ================= TOPBAR ================= -->

    <header class="topbar">

      <div class="patient-topbar-title">

        <a
          href="patient-dashboard.html"
          class="patient-topbar-back-link"
          aria-label="Back to dashboard"
        >
          ←
        </a>

        <span>
          Book Appointment
        </span>

      </div>


      <div class="topbar-right">

        <div class="avatar">

          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
          </svg>

        </div>


        <div class="user-block">

          <div>

            <div
              class="user-name"
              id="patientTopbarName"
            >
              Charmaine
            </div>

            <div class="user-role">
              Patient
            </div>

          </div>

        </div>

      </div>

    </header>


    <!-- ================= CONTENT ================= -->

    <section class="content book-appointment-content">

      <!-- Page Header -->

      <div class="page-header">

        <div>

          <h1 class="page-title font-display">
            Book Appointment
          </h1>

          <div class="page-sub">
            Schedule your next visit
          </div>

        </div>

      </div>


      <!-- Breadcrumb -->

      <div class="patient-breadcrumb">

        <a
          href="patient-dashboard.html"
          class="breadcrumb-link"
        >
          Dashboard
        </a>

        <span>›</span>

        <span>
          Book Appointment
        </span>

      </div>


      <!-- ================= APPOINTMENT FORM ================= -->

      <section class="book-appointment-panel">

        <form id="bookAppointmentForm">

          <div class="book-appointment-grid">

            <!-- Patient ID -->

            <div class="field">

              <label for="appointmentPatientId">
                Patient ID
              </label>

              <input
                class="input"
                type="text"
                id="appointmentPatientId"
                placeholder="Enter patient ID"
                required
              />

            </div>


            <!-- Clinic -->

            <div class="field">

              <label for="appointmentClinic">
                Select Clinic
              </label>

              <select
                class="input"
                id="appointmentClinic"
                required
              >

                <option value="" selected disabled>
                  Select clinic
                </option>

                <option value="District Six Clinic">
                  District Six Clinic
                </option>

                <option value="Bellville Clinic">
                  Bellville Clinic
                </option>

                <option value="Khayelitsha Clinic">
                  Khayelitsha Clinic
                </option>

                <option value="Mitchells Plain Clinic">
                  Mitchells Plain Clinic
                </option>

              </select>

            </div>


            <!-- Department -->

            <div class="field">

              <label for="appointmentDepartment">
                Department
              </label>

              <select
                class="input"
                id="appointmentDepartment"
                required
              >

                <option value="" selected disabled>
                  Select department
                </option>

                <option value="General Medicine">
                  General Medicine
                </option>

                <option value="Pediatrics">
                  Pediatrics
                </option>

                <option value="Antenatal Care">
                  Antenatal Care
                </option>

                <option value="HIV Care">
                  HIV Care
                </option>

                <option value="Dental">
                  Dental
                </option>

              </select>

            </div>


            <!-- Date -->

            <div class="field">

              <label for="appointmentDate">
                Date
              </label>

              <input
                class="input"
                type="date"
                id="appointmentDate"
                required
              />

            </div>


            <!-- Time Slot -->

            <div class="field">

              <label for="appointmentTime">
                Time Slot
              </label>

              <select
                class="input"
                id="appointmentTime"
                required
              >

                <option value="" selected disabled>
                  Select time slot
                </option>

                <option value="08:00 AM">
                  08:00 AM
                </option>

                <option value="09:00 AM">
                  09:00 AM
                </option>

                <option value="10:00 AM">
                  10:00 AM
                </option>

                <option value="11:00 AM">
                  11:00 AM
                </option>

                <option value="12:00 PM">
                  12:00 PM
                </option>

                <option value="01:00 PM">
                  01:00 PM
                </option>

                <option value="02:00 PM">
                  02:00 PM
                </option>

                <option value="03:00 PM">
                  03:00 PM
                </option>

              </select>

            </div>

          </div>


          <!-- Symptoms -->

          <div class="field book-appointment-reason">

            <label for="appointmentReason">
              Symptoms / Reason for visit
            </label>

            <textarea
              class="input"
              id="appointmentReason"
              placeholder="Describe your symptoms or reason for the visit"
              required
            ></textarea>

          </div>


          <!-- Error Message -->

          <div
            id="appointmentError"
            class="book-appointment-error"
          ></div>


          <!-- Actions -->

          <div class="book-appointment-actions">

            <a
              href="patient-dashboard.html"
              class="btn btn-ghost"
            >
              Cancel
            </a>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Confirm
            </button>

          </div>

        </form>

      </section>

    </section>

  </main>

</div>


<script src="../js/data.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/pages/book-appointment.js"></script>

</body>
</html>
